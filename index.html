        body {
            font-family: 'Mali', cursive;
            background-color: #FFF9F0;
            /* Fun polka dot background pattern */
            background-image: radial-gradient(#FFD1D1 1.5px, transparent 1.5px), radial-gradient(#FFD1D1 1.5px, #FFF9F0 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            color: #4A5568;
        }
        
        /* Bouncy Button Animation */
        .btn-bounce:active {
            transform: scale(0.95);
        }
        .btn-hover:hover {
            transform: translateY(-3px);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF5F5; 
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB7B2; 
            border-radius: 20px;
            border: 2px solid #FFF5F5;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF9E9E; 
        }
    </style>

        const createLucideIcon = (iconName) => ({ size = 24, className, strokeWidth = 2.5, ...props }) => {
            const iconData = lucide.icons[iconName];
            if (!iconData) return null;
            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth={strokeWidth}
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                    {...props}
                    dangerouslySetInnerHTML={{ 
                        __html: iconData.map(child => {
                            const [tag, attrs] = child;
                            const attrString = Object.entries(attrs).map(([key, val]) => `${key}="${val}"`).join(' ');
                            return `<${tag} ${attrString} />`;
                        }).join('')

        const CalendarView = () => {
            const [currentDate, setCurrentDate] = useState(new Date(2025, 9, 1));
            const [selectedDate, setSelectedDate] = useState(null);
            const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const firstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

            const handleMonthChange = (offset) => {
                setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1));
                setSelectedDate(null);
            };

            const renderDays = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const days = daysInMonth(year, month);
                const firstDay = firstDayOfMonth(year, month);
                const dayElements = [];
                const thaiDays = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

                const header = thaiDays.map((day, idx) => (
                    <div key={day} className={`text-center font-bold text-sm py-1 ${idx === 0 || idx === 6 ? 'text-[#FF8E8E]' : 'text-[#2A9D8F]'}`}>{day}</div>
                ));

                for (let i = 0; i < firstDay; i++) dayElements.push(<div key={`empty-${i}`} className="h-8"></div>);

                for (let d = 1; d <= days; d++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const hasEvent = calendarEvents[dateStr];
                    const isSelected = selectedDate === dateStr;
                    
                    let bgClass = "bg-white hover:bg-[#F0FFF4]";
                    let textClass = "text-slate-600";
                    let borderClass = "border-2 border-transparent";
                    
                    if (new Date(year, month, d).getDay() % 6 === 0) { bgClass = "bg-[#FFF5F5]"; textClass = "text-[#FF8E8E] font-bold"; }
                    if (hasEvent) {
                        if (hasEvent.type === 'holiday') { bgClass = "bg-[#FF8E8E]"; textClass = "text-white"; }
                        else if (hasEvent.type === 'school') { bgClass = "bg-[#95E1D3]"; textClass = "text-teal-900"; }
                        else { bgClass = "bg-[#FFEF96]"; textClass = "text-amber-900"; }
                    }
                    if (isSelected) { bgClass = "bg-[#8338EC]"; textClass = "text-white font-bold"; borderClass = "border-2 border-white ring-2 ring-[#8338EC]"; }

                                        <a href={activePage === 'students' ? reportLink : homeworkLink} target="_blank" rel="noreferrer" className="inline-block mt-5 text-sm font-bold text-white bg-slate-400 px-6 py-2 rounded-full hover:bg-slate-500 transition shadow-sm">เปิดเต็มจอ ⤢</a>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'lessons':
                        return (
                            <div className="space-y-4">
                                <div className="p-1.5 rounded-[2.5rem] shadow-xl bg-gradient-to-b from-[#2A9D8F] to-[#1F7A6F]">
                                    <div className="bg-white rounded-[2.2rem] p-5 text-center">
                                        <BookOpen size={48} className="mx-auto text-[#2A9D8F] mb-2" />
                                        <h3 className="font-bold text-slate-700 text-2xl mb-3">บทเรียนออนไลน์</h3>
                                        
                                        <div className="bg-slate-50 p-4 rounded-2xl mb-4 text-sm text-slate-600 border-2 border-dashed border-slate-200">
                                            <h4 className="font-bold mb-2 text-center text-base">📚 เรียนสนุก ลุกนั่งสบาย:</h4>
                                            <p>เลือกหน่วยการเรียนรู้ที่ต้องการศึกษาจากรายการด้านล่างได้เลยจ้า</p>
                                        </div>

                                        <div className="h-[550px] w-full bg-slate-50 rounded-2xl overflow-hidden border-4 border-slate-100 shadow-inner">
                                            <iframe src={lessonLink} className="w-full h-full border-0" title="Lessons Frame"></iframe>
                                        </div>
                                        <a href={lessonLink} target="_blank" rel="noreferrer" className="inline-block mt-5 text-sm font-bold text-white bg-slate-400 px-6 py-2 rounded-full hover:bg-slate-500 transition shadow-sm">เปิดเต็มจอ ⤢</a>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'news':
                        return (
                            <div className="space-y-4">
                                <div className="p-1.5 rounded-[2.5rem] shadow-xl bg-gradient-to-b from-[#FF70A6] to-[#C94277]">
                                    <div className="bg-white rounded-[2.2rem] p-4 text-center">
                                        <Megaphone size={48} className="mx-auto text-[#FF70A6] mb-2" />
                                        <h3 className="font-bold text-slate-700 text-2xl mb-3">ข่าวสารประชาสัมพันธ์</h3>
                                        
                                        <div className="bg-slate-50 p-4 rounded-2xl mb-4 text-sm text-slate-600 border-2 border-dashed border-slate-200">
                                            <h4 className="font-bold mb-2 text-center text-base">📢 ประกาศๆ:</h4>
                                            <p>ใช้นิ้วปัดเลื่อนซ้าย-ขวาที่รูปข่าวเพื่อดูภาพถัดไปได้เลยครับ</p>
                                        </div>

                                        <div className="h-[550px] w-full bg-slate-50 rounded-2xl overflow-hidden border-4 border-slate-100 relative shadow-inner">
                                            <iframe src={newsLink} className="w-full h-full border-0 block" title="News Frame"></iframe>
                                        </div>
                                        <a href={newsLink} target="_blank" rel="noreferrer" className="inline-block mt-5 text-sm font-bold text-white bg-slate-400 px-6 py-2 rounded-full hover:bg-slate-500 transition shadow-sm">เปิดเต็มจอ ⤢</a>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'itinfo':
                        return (
                            <div className="space-y-4">
                                <div className="p-1.5 rounded-[2.5rem] shadow-xl bg-gradient-to-b from-[#A78BFA] to-[#7C3AED]">
                                    <div className="bg-white rounded-[2.2rem] p-4 text-center">
                                        <Monitor size={48} className="mx-auto text-[#8B5CF6] mb-2" />
                                        <h3 className="font-bold text-slate-700 text-2xl mb-3">ข้อมูลสารสนเทศ</h3>
                                        
                                        <div className="bg-slate-50 p-4 rounded-2xl mb-4 text-sm text-slate-600 border-2 border-dashed border-slate-200">
                                            <h4 className="font-bold mb-2 text-center text-base">📊 ระบบสารสนเทศ:</h4>
                                            <p>ดูข้อมูลและสถิติต่างๆ ของสถานศึกษาได้ที่นี่</p>
                                        </div>

                                        <div className="h-[550px] w-full bg-slate-50 rounded-2xl overflow-hidden border-4 border-slate-100 relative shadow-inner">
                                            <iframe src="https://gornphet.github.io/eduit2/" className="w-full h-full border-0 block" title="IT Info Frame"></iframe>
                                        </div>
                                        <a href="https://gornphet.github.io/eduit2/" target="_blank" rel="noreferrer" className="inline-block mt-5 text-sm font-bold text-white bg-slate-400 px-6 py-2 rounded-full hover:bg-slate-500 transition shadow-sm">เปิดเต็มจอ ⤢</a>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'activities':
                        return <CalendarView />;
                    case 'health':
                        return (
                            <div className="space-y-4">
                                <div className="p-1.5 rounded-[2.5rem] shadow-xl bg-gradient-to-b from-[#EF476F] to-[#B83253]">
                                    <div className="bg-white rounded-[2.2rem] p-5 text-center">
                                        <ShieldAlert size={48} className="mx-auto text-[#EF476F] mb-2" />
                                        <h3 className="font-bold text-slate-700 text-2xl mb-3">ข้อมูลโรคติดต่อ</h3>
                                        
                                        <div className="bg-slate-50 p-4 rounded-2xl mb-4 text-sm text-slate-600 border-2 border-dashed border-slate-200">
                                            <h4 className="font-bold mb-2 text-center text-base">🦠 รู้ทันป้องกันโรค:</h4>
                                            <p>ติดตามข้อมูลข่าวสารเกี่ยวกับโรคติดต่อและการป้องกันได้ที่นี่</p>
                                        </div>

                                        <div className="h-[550px] w-full bg-slate-50 rounded-2xl overflow-hidden border-4 border-slate-100 shadow-inner">
                                            <iframe src={diseaseLink} className="w-full h-full border-0" title="Disease Frame"></iframe>
                                        </div>
                                        <a href={diseaseLink} target="_blank" rel="noreferrer" className="inline-block mt-5 text-sm font-bold text-white bg-slate-400 px-6 py-2 rounded-full hover:bg-slate-500 transition shadow-sm">เปิดเต็มจอ ⤢</a>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'links':
                        return (
                            <div className="space-y-4">
                                {[
                                    { name: "เทศบาลตำบลหัวดง", url: "http://www.huadong.go.th", icon: <HomeIcon />, color: "border-[#FFEF96] text-[#F57F17]", bg: "bg-[#FFFDE7]" },
                                    { name: "กองการศึกษา", url: "https://gornphet.github.io/edumain/", icon: <BookOpen />, color: "border-[#3DA9FC] text-[#0277BD]", bg: "bg-[#E1F5FE]" },
                                    { name: "จังหวัดอุตรดิตถ์", url: "http://www2.uttaradit.go.th", icon: <MapPin />, color: "border-[#D1C4E9] text-[#512DA8]", bg: "bg-[#EDE7F6]" },
                                    { name: "กรมส่งเสริมการปกครองท้องถิ่น", url: "https://www.dla.go.th/", icon: <Flag />, color: "border-[#95E1D3] text-[#00695C]", bg: "bg-[#E0F2F1]" }
                                ].map((l, i) => (
                                    <a key={i} href={l.url} target="_blank" rel="noreferrer" className={`flex items-center gap-4 p-5 rounded-[2rem] border-4 shadow-md hover:shadow-lg hover:scale-105 transition-all ${l.color} ${l.bg} text-decoration-none`}>
                                        <div className="p-3 bg-white/70 rounded-2xl shadow-sm">{l.icon}</div>
                                        <span className="font-bold text-lg">{l.name}</span>
                                        <ExternalLink size={20} className="ml-auto opacity-50"/>
                                    </a>
                                ))}
                                
                                <div className="mt-6 p-4 bg-yellow-50 rounded-3xl border-2 border-dashed border-yellow-300 text-center">
                                    <p className="text-sm text-yellow-800 font-bold">
                                        💡 เคล็ดลับ: ถ้ากดแล้วไม่ไป ให้กดค้างไว้แล้วเลือก "เปิดลิงก์" นะครับ
                                    </p>
                                </div>
                            </div>
                        );
                    case 'contact':
                        return (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-[2.5rem] border-4 border-[#06D6A0] text-center shadow-lg relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-4 bg-[#06D6A0] opacity-20"></div>
                                    <div className="bg-[#E0F2F1] w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 text-[#06D6A0] shadow-sm">
                                        <Megaphone size={48} />
                                    </div>
                                    <h3 className="font-bold text-xl text-[#00695C] mb-2">แจ้งเรื่องร้องทุกข์ / ขอรับบริการ</h3>
                                    <p className="text-sm text-slate-600 mb-6 bg-slate-50 p-2 rounded-xl inline-block">
                                        ยื่นคำร้องออนไลน์ ผ่าน LINE Official Account เทศบาลตำบลหัวดง
                                    </p>
                                    
                                    <div className="bg-[#F0FDFA] p-6 rounded-[2rem] border-4 border-dashed border-[#06D6A0] mb-6 inline-block transform hover:rotate-2 transition">
                                        <img 
                                            src="https://res.cloudinary.com/dygneumft/image/upload/v1767279233/QR%20CODE%20line%20%E0%B9%80%E0%B8%97%E0%B8%A8%E0%B8%9A%E0%B8%B2%E0%B8%A5/545908739_122129932418901421_5742830582382325853_n_li53ev.png" 
                                            alt="LINE QR Code" 
                                            className="w-48 h-48 object-contain mx-auto mix-blend-multiply cursor-pointer"
                                            onClick={() => setSelectedImage("https://res.cloudinary.com/dygneumft/image/upload/v1767279233/QR%20CODE%20line%20%E0%B9%80%E0%B8%97%E0%B8%A8%E0%B8%9A%E0%B8%B2%E0%B8%A5/545908739_122129932418901421_5742830582382325853_n_li53ev.png")}
                                        />
                                        <p className="text-sm text-[#00695C] mt-2 font-bold bg-white/50 rounded-lg">แตะเพื่อขยาย 🔍</p>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="bg-[#E0F2F1] p-4 rounded-2xl border-2 border-[#B2DFDB]">
                                            <p className="text-sm font-bold text-slate-600">Add Line ID:</p>
                                            <p className="text-2xl font-black text-[#00695C] tracking-wider">@541kcjov</p>
                                        </div>
                                        <a 
                                            href="https://lin.ee/BGlLgO0" 
                                            target="_blank" 
                                            rel="noreferrer"
                                            className="flex items-center justify-center gap-2 w-full bg-[#06D6A0] text-white py-4 rounded-2xl font-bold shadow-md hover:bg-[#059669] hover:scale-105 transition-all text-decoration-none text-lg"
                                        >
                                            <MessageCircle size={24} /> คลิกเพิ่มเพื่อน LINE
                                        </a>
                                    </div>
                                </div>

                                <div className="bg-white p-8 rounded-[2.5rem] border-4 border-[#3DA9FC] text-center shadow-lg">
                                    <div className="bg-[#E1F5FE] w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 text-[#3DA9FC] shadow-sm">
                                        <Phone size={48} />
                                    </div>
                                    <h3 className="font-bold text-xl text-[#0277BD] mb-2">เบอร์โทรศัพท์ติดต่อ</h3>
                                    <p className="text-base font-bold text-slate-600 mb-6">
                                        เทศบาลตำบลหัวดง
                                    </p>
                                    <a 
                                        href="tel:055427222" 
                                        className="flex items-center justify-center gap-3 w-full bg-[#3DA9FC] text-white py-4 rounded-2xl font-bold shadow-md hover:bg-[#0284C7] hover:scale-105 transition-all text-decoration-none text-xl"
                                    >
                                        <Phone size={28} /> 055-427-222
                                    </a>
                                </div>
                            </div>
                        );
                    case 'appinfo':
                        return (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-[2.5rem] border-4 border-[#FFD166] text-center shadow-lg relative overflow-hidden">
                                    <div className="bg-[#FFF8E1] w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 text-[#FFA000] shadow-sm">
                                        <HelpCircle size={48} />
                                    </div>
                                    <h3 className="font-bold text-xl text-[#FFA000] mb-2">ติดตั้งแอปพลิเคชัน</h3>
                                    <p className="text-sm text-slate-600 mb-6 bg-slate-50 p-2 rounded-xl inline-block">
                                        สแกน QR Code หรือกดปุ่มด้านล่างเพื่อใช้งาน
                                    </p>
                                    
                                    <div className="bg-white p-4 rounded-[2rem] border-4 border-dashed border-[#FFD166] mb-6 inline-block transform hover:rotate-1 transition">
                                        <img 
                                            src="https://res.cloudinary.com/dygneumft/image/upload/v1770859758/%E0%B8%84%E0%B8%B9%E0%B9%88%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B9%81%E0%B8%AD%E0%B8%9B/QR_app_%E0%B8%A8%E0%B8%9E%E0%B8%94_srncv3.png" 
                                            alt="App QR Code" 
                                            className="w-48 h-48 object-contain mx-auto mix-blend-multiply cursor-pointer"
                                            onClick={() => setSelectedImage("https://res.cloudinary.com/dygneumft/image/upload/v1770859758/%E0%B8%84%E0%B8%B9%E0%B9%88%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B9%81%E0%B8%AD%E0%B8%9B/QR_app_%E0%B8%A8%E0%B8%9E%E0%B8%94_srncv3.png")}
                                        />
                                        <p className="text-sm text-[#FFA000] mt-2 font-bold bg-[#FFF8E1] rounded-lg">แตะเพื่อขยาย 🔍</p>
                                    </div>
                                </div>

                                <div className="bg-[#E0F7FA] p-8 rounded-[2.5rem] border-4 border-[#4DD0E1] text-center shadow-lg">
                                    <div className="bg-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-[#00ACC1] shadow-sm">
                                        <BookOpen size={40} />
                                    </div>
                                    <h3 className="font-bold text-xl text-[#00838F] mb-3">คู่มือการใช้งาน</h3>
                                    <p className="text-base font-bold text-slate-600 mb-6">
                                        ศึกษาขั้นตอนการติดตั้งและใช้งานอย่างละเอียด
                                    </p>
                                    <a 
                                        href="https://drive.google.com/file/d/18w28UvDWYRTCr1vyro1kQQwa_A7RNyoN/view" 
                                        target="_blank" 
                                        rel="noreferrer"
                                        className="flex items-center justify-center gap-3 w-full bg-[#4DD0E1] text-white py-4 rounded-2xl font-bold shadow-md hover:bg-[#00BCD4] hover:scale-105 transition-all text-decoration-none text-xl btn-bounce"
                                    >
                                        <Book size={28} /> เปิดคู่มือ (PDF)
                                    </a>
                                </div>
                            </div>
                        );
                    default:
                        return (
                            <div className="text-center py-24 text-slate-300">
                                <div className="bg-slate-50 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 border-4 border-slate-100"><Smile size={48} /></div>
                                <h3 className="text-2xl font-bold">กำลังสร้าง... รอก่อนนะ</h3>
                            </div>
                        );
                }
            };

            const renderDetail = () => {
                const item = menuItems.find(i => i.id === activePage);
                if (!item) return null;

                return (
                    <div className="min-h-screen bg-[#FFF9F0] pb-32">
                        {/* Kid-style Navbar */}
                        <div className="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-md px-4 py-3 flex items-center gap-3 rounded-b-[2rem] border-b-4 border-slate-100">
                            <button onClick={() => setActivePage('home')} className="p-3 bg-[#FFEF96] rounded-full text-amber-800 shadow-sm hover:scale-110 transition"><ChevronLeft size={24} strokeWidth={3} /></button>
                            <div className={`p-2.5 rounded-2xl ${item.color} shadow-sm border-2 border-white`}>{React.cloneElement(item.icon, { size: 22, strokeWidth: 3 })}</div>
                            <h2 className="text-xl font-black text-slate-700">{item.title}</h2>
                        </div>

                        <div className="p-5">
                            {renderContent()}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen font-sans max-w-md mx-auto bg-[#FFF9F0] shadow-2xl relative overflow-hidden border-x-4 border-[#FFF0F0]">
                    {activePage === 'home' ? renderDashboard() : renderDetail()}
                    <ImageModal src={selectedImage} onClose={() => setSelectedImage(null)} />
                    
                    {/* Bottom Nav (Floating Bubble Style) */}
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-[380px] bg-white/95 backdrop-blur-sm rounded-[2rem] shadow-[0_8px_30px_rgba(0,0,0,0.12)] flex justify-between p-2.5 border-4 border-[#E2E8F0]">
                        {[
                            { id: 'home', icon: <Home />, label: 'หน้าหลัก', color: 'text-[#3DA9FC]', bg: 'bg-[#E1F5FE]' },
                            { id: 'news', icon: <Megaphone />, label: 'แจ้งเตือน', color: 'text-[#FF70A6]', bg: 'bg-[#FFEBEE]' },
                            { id: 'activities', icon: <Calendar />, label: 'ปฏิทิน', color: 'text-[#FF9F1C]', bg: 'bg-[#FFF8E1]' },
                            { id: 'contact', icon: <Phone />, label: 'ติดต่อ', color: 'text-[#06D6A0]', bg: 'bg-[#E0F2F1]' },
                        ].map(nav => (
                            <button key={nav.id} onClick={() => setActivePage(nav.id)} className={`flex flex-col items-center justify-center w-16 h-16 rounded-[1.5rem] transition-all duration-300 ${activePage === nav.id ? `${nav.bg} ${nav.color} -translate-y-4 shadow-lg scale-110 border-4 border-white` : 'text-slate-300 hover:text-slate-400'}`}>
                                {React.cloneElement(nav.icon, { size: activePage === nav.id ? 28 : 26, strokeWidth: 3 })}
                                {activePage === nav.id && <span className="text-[10px] font-bold mt-0.5">{nav.label}</span>}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
